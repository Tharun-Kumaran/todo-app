# Render blueprint: free-tier deployment.
#
# - A free Docker web service (no persistent disk needed; Time Machine and
#   invite state live in the `app_state` Postgres table).
# - Postgres comes from Neon's free tier; paste its connection string when
#   Render prompts for DATABASE_URL.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: todo-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      # Neon connection string, including the password. Prefer the pooled host.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: TODO_INVITE_ONLY
        value: "1"
      - key: TODO_SESSION_DAYS
        value: "30"
      # Public origin used in email links, e.g. https://todo-app.onrender.com
      # (no trailing slash). Set after Render assigns the service URL.
      - key: TODO_PUBLIC_URL
        sync: false
      # Resend test sender: only delivers to the Resend account owner until a
      # domain is verified. Change TODO_EMAIL_FROM when that happens.
      - key: RESEND_API_KEY
        sync: false
      - key: TODO_EMAIL_FROM
        value: "To-Do <onboarding@resend.dev>"
